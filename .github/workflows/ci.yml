name: CI

on:
  push:
  pull_request:

# These workflows never authorize real site requests or booking.
env:
  LIVE_E2E: "0"
  LIVE_BOOKING: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Install Chromium
        run: uv run --locked playwright install --with-deps chromium
      - name: Check Python
        run: uv run --locked ruff check .
      - name: Check userscript syntax
        run: node --check userscripts/91160-doctor-page-poller.user.js
      - name: Check Node contract harness syntax
        run: node --check tests/contracts/booking/node_harness.cjs
      - name: Run unit and offline canary tests
        run: uv run --locked pytest -q -m "not live" --ignore=tests/contracts --ignore=tests/integration
      - name: Run shared contracts and local Chromium acceptance
        run: uv run --locked pytest -q tests/contracts/ tests/integration/ -m "not live" --browser chromium
