name: CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# These workflows never authorize real site requests or booking.
env:
  LIVE_E2E: "0"
  LIVE_BOOKING: "0"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Use a fixed Ubuntu release for predictable browser dependencies.
        os: [ubuntu-24.04, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.9.30"
          # Keep the local gate reproducible; no cache in this workflow.
          enable-cache: "false"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Install Chromium
        run: uv run --locked playwright install --with-deps chromium
      - name: Check Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check userscript syntax
        run: node --check userscripts/91160-doctor-page-poller.user.js
      - name: Check Node contract harness syntax
        run: node --check tests/contracts/booking/node_harness.cjs
      - name: Run unit and offline canary tests
        run: uv run --locked pytest -q -m "not live" --ignore=tests/contracts --ignore=tests/integration
      - name: Run shared contracts and local Chromium acceptance
        run: uv run --locked pytest -q tests/contracts/ tests/integration/ -m "not live" --browser chromium
