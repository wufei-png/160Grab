name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Install Chromium
        run: uv run --locked playwright install --with-deps chromium
      - name: Check Python
        run: uv run --locked ruff check .
      - name: Check userscript syntax
        run: node --check userscripts/91160-doctor-page-poller.user.js
      - name: Run unit, contract and local Chromium tests
        run: uv run --locked pytest -q -m "not live" --browser chromium
