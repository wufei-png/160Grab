name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# These workflows never authorize real site requests or booking.
env:
  LIVE_E2E: "0"
  LIVE_BOOKING: "0"

jobs:
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
          - label: macos-arm64
            os: macos-15
            platform: macos
            arch: arm64
          - label: macos-intel
            os: macos-15-intel
            platform: macos
            arch: intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.30"
          # Keep the release gate reproducible; no cache in this workflow.
          enable-cache: "false"
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Install Chromium
        run: uv run --locked playwright install --with-deps chromium
      - name: Check Python
        run: uv run --locked ruff check .
      - name: Check Python formatting
        run: uv run --locked ruff format --check .
      - name: Check userscript syntax
        run: node --check userscripts/91160-doctor-page-poller.user.js
      - name: Check Node contract harness syntax
        run: node --check tests/contracts/booking/node_harness.cjs
      - name: Run unit and offline canary tests
        run: uv run --locked pytest -q -m "not live" --ignore=tests/contracts --ignore=tests/integration
      - name: Run shared contracts and local Chromium acceptance
        run: uv run --locked pytest -q tests/contracts/ tests/integration/ -m "not live" --browser chromium
      - name: Build Windows release bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Build macOS release bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: ./packaging/build-macos.sh
      - name: Verify Windows frozen binary
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & "./dist/release/160Grab-${{ matrix.label }}/160Grab.exe" --help
          if ($LASTEXITCODE -ne 0) {
              throw "Frozen binary help check failed."
          }
          & "./dist/release/160Grab-${{ matrix.label }}/160Grab.exe" --smoke-browser
          if ($LASTEXITCODE -ne 0) {
              throw "Frozen browser smoke check failed."
          }
      - name: Verify Windows config bootstrap
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundleDir = "./dist/release/160Grab-${{ matrix.label }}"
          $configPath = Join-Path $bundleDir "config.yaml"
          Remove-Item -Path $configPath -Force
          & (Join-Path $bundleDir "160Grab.exe")
          if ($LASTEXITCODE -ne 0) {
              throw "Frozen binary did not exit cleanly during config bootstrap test."
          }
          if (-not (Test-Path $configPath)) {
              throw "Frozen binary did not recreate config.yaml."
          }
      - name: Verify macOS frozen binary
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          "./dist/release/160Grab-${{ matrix.label }}/160Grab" --help
          "./dist/release/160Grab-${{ matrix.label }}/160Grab" --smoke-browser
      - name: Verify macOS config bootstrap
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="./dist/release/160Grab-${{ matrix.label }}"
          config_path="$bundle_dir/config.yaml"
          rm "$config_path"
          "$bundle_dir/160Grab"
          test -f "$config_path"
      - name: Upload release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.label }}
          path: |
            dist/release/160Grab-${{ matrix.label }}.zip
            dist/release/160Grab-${{ matrix.label }}.zip.sha256

  release:
    # A branch dispatch verifies frozen bundles without publishing a release.
    # Publishing still requires a version tag, including for manual dispatches.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: release-artifacts
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd release-artifacts
          find . -type f -name '*.zip' -print0 | sort -z | while IFS= read -r -d '' archive; do
            (cd "$(dirname "$archive")" && sha256sum -- "$(basename "$archive")")
          done > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cd release-artifacts
          mapfile -t zip_files < <(find . -type f -name '*.zip' | sort)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${zip_files[@]}" SHA256SUMS --repo "${GH_REPO}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${zip_files[@]}" SHA256SUMS --repo "${GH_REPO}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
